# Pinned because volume and network names are built from it, and it is the
# unit `down --remove-orphans` acts on.
name: pylovo

services:
  # HAProxy load balancer in front of the api replicas
  proxy:
    image: haproxy:2.9-alpine
    ports:
      - "8086:80"
      - "8404:8404"  # Stats dashboard
    volumes:
      - ../haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      default:
      spatialhub-net:
        # Callers address the alias; `api` is shared by other repositories on
        # the network and is never an address. pylovo-haproxy stays until
        # callers move to pylovo.
        aliases:
          - pylovo
          - pylovo-haproxy

  # Redis Cache (shared across all workers)
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru
    restart: unless-stopped

  # PostgreSQL with PostGIS + pgRouting
  postgres:
    image: pgrouting/pgrouting:17-3.5-3.7.3
    shm_size: 8g
    ports:
      - "${PYLOVO_POSTGRES_PORT:-5434}:5432"
    environment:
      - POSTGRES_DB=pylovo_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pylovo-pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "12"
          memory: 56G
        reservations:
          memory: 16G
    command:
      - "postgres"
      # Memory — 64 GB budget (shared server with PyPSA/Calliope)
      - "-c"
      - "shared_buffers=14GB"
      - "-c"
      - "effective_cache_size=42GB"
      - "-c"
      - "work_mem=128MB"
      - "-c"
      - "maintenance_work_mem=2GB"
      - "-c"
      - "huge_pages=try"
      # Parallelism — 12 cores budget
      - "-c"
      - "max_worker_processes=12"
      - "-c"
      - "max_parallel_workers=8"
      - "-c"
      - "max_parallel_workers_per_gather=4"
      - "-c"
      - "max_parallel_maintenance_workers=4"
      # Connections
      - "-c"
      - "max_connections=200"
      # WAL & Checkpoints
      - "-c"
      - "wal_buffers=256MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=8GB"
      # Planner
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "default_statistics_target=500"
      - "-c"
      - "jit=on"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pylovo_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PyLovo API replicas, discovered by the proxy through Docker DNS
  api:
    build:
      context: ..
      dockerfile: environment/Dockerfile
    deploy:
      replicas: 3
    networks:
      default:
        # The proxy resolves this alias; `api` would also match other
        # repositories' services on spatialhub-net, which the proxy joins.
        aliases:
          - pylovo-api-pool
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ../.env.docker
    volumes:
      - ../raw_data:/app/raw_data
      - ../api:/app/api:ro
      - ../src:/app/src:ro
      - ../runme:/app/runme:ro
      - ../datapipeline:/app/datapipeline:ro
      - ../datapipeline/cache:/app/datapipeline/cache
      - ../config:/app/config:ro
    environment:
      - HOST=postgres
      - PORT=5432
      - DBNAME=pylovo_db
      - DBUSER=postgres
      - PASSWORD=postgres
      - TARGET_SCHEMA=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8086", "--workers", "4"]

networks:
  spatialhub-net:
    external: true

volumes:
  pylovo-pgdata:
